<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Car Dekho</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ANIMATED GRADIENT BACKGROUND */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* FLOATING CAR BACKGROUND */
        @keyframes floatCar {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
            50% { transform: translateY(-30px) rotate(5deg); opacity: 0.6; }
            100% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
        }

        /* SMOOTH FADE-IN FOR THE BOX */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background: linear-gradient(135deg, #f4f4f4, #e0e7ff, #f4f4f4);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
        }
        
        /* FLOATING CAR ICONS */
        .bg-car {
            position: fixed;
            z-index: -1;
            font-size: 5rem;
            color: rgba(0, 0, 0, 0.1);
            animation: floatCar 8s infinite ease-in-out;
        }
        .bg-car-1 { top: 15%; left: 10%; animation-delay: 0s; }
        .bg-car-2 { top: 70%; left: 80%; animation-delay: 2s; font-size: 4rem; }
        .bg-car-3 { top: 80%; left: 20%; animation-delay: 4s; }
        
        /* EXACT NAVBAR CSS */
        .navbar { display: flex; align-items: center; gap: 20px; padding: 10px; background-color: #f8f9fa; }
        .navbar a { text-decoration: none; color: black; font-weight: 500; }
        .navbar { display: flex; align-items: center; gap: 20px; white-space: nowrap; }
        .anchor { display: flex; gap: 20px; margin-left: auto; }
        .navbar .fa-bars { display: none; }
        
        @media (max-width: 768px) {
            .navbar .fa-bars { display: block; cursor: pointer; font-size: 24px; }
            .anchor { display: none; flex-direction: column; position: absolute; top: 50px; background: white; width: 100%; padding: 20px; left: 0; }
            .anchor.active { display: flex; }
        }

        /* AUTH PAGE CSS - PREMIUM & ANIMATED */
        .auth-container {
            max-width: 360px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            height: calc(100vh - 50px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: fadeIn 1.2s ease-out;
        }
        .auth-title { text-align: center; font-size: 2rem; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #444; font-size: 0.9rem; }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid #ddd; 
            font-size: 1rem; 
            background: #f9f9f9; 
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #007bff;
            background: white;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
            outline: none;
        }
        
        .auth-btn { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(90deg, #007bff, #0056b3); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
            margin-top: 10px;
        }
        .auth-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 20px rgba(0, 123, 255, 0.4); 
        }
        
        .auth-switch { text-align: center; margin-top: 15px; font-size: 0.85rem; color: #777; }
        .auth-switch a { color: #007bff; font-weight: bold; text-decoration: none; }
        
        .alert-msg { color: #dc3545; font-weight: bold; text-align: center; margin-top: 5px; display: none; font-size: 0.9rem; }

        /* --- AESTHETIC UPGRADE: FONTS --- */
        body {
            font-family: 'Poppins', sans-serif;
        }

        h1, h2, h3, .brand-title, .featured-cars h2, .contact-title, .compare-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        /* --- DARK MODE STYLES --- */
        body.dark-mode {
            background: #121212;
            color: #e0e0e0;
        }

        body.dark-mode .navbar {
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
        }

        body.dark-mode .navbar a {
            color: #e0e0e0;
        }

        body.dark-mode .auth-container {
            background: #1e1e1e;
            color: #e0e0e0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        body.dark-mode .auth-title {
            color: #e0e0e0;
        }

        body.dark-mode .form-group label {
            color: #e0e0e0;
        }

        body.dark-mode .form-group input {
            background: #2a2a2a;
            color: #e0e0e0;
            border-color: #555;
        }

        body.dark-mode .form-group input:focus {
            background: #1e1e1e;
            border-color: #4da3ff;
            box-shadow: 0 0 0 3px rgba(77, 163, 255, 0.1);
        }

        body.dark-mode .auth-switch {
            color: #a0a0a0;
        }

        /* Floating Cars visible in Dark Mode */
        body.dark-mode .bg-car {
            color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- FLOATING CAR BACKGROUND -->
    <i class="fas fa-car bg-car bg-car-1"></i>
    <i class="fas fa-car-side bg-car bg-car-2"></i>
    <i class="fas fa-car bg-car bg-car-3"></i>

    <nav class="navbar">
        <i class="fas fa-car"></i> Car Dekho
        <i class="fas fa-bars"></i>
        <div class="anchor">
            <a href="index.html">Home</a>
            <a href="cars.html">Cars</a>
            <a href="compare.html">Compare</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html" style="color: #007bff; font-weight: bold;">Login</a>
        </div>
    </nav>

    <div class="auth-container">
        <h1 class="auth-title">Login</h1>
        
        <div class="alert-msg" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="auth-btn">Login</button>
        </form>

        <div class="auth-switch">
            Don't have an account? <a href="registration.html">Register here</a>
        </div>
    </div>

    <!-- DARK MODE JAVASCRIPT -->
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';
            
            // Get all registered users from localStorage
            const users = JSON.parse(localStorage.getItem('carDekhoUsers')) || [];
            
            // Check if user exists
            const foundUser = users.find(u => u.email === email.toLowerCase());
            
            if (!foundUser) {
                errorMsg.textContent = "You are not registered. Please register first!";
                errorMsg.style.display = 'block';
                return;
            }
            
            if (foundUser.password !== password) {
                errorMsg.textContent = "Incorrect password. Please try again.";
                errorMsg.style.display = 'block';
                return;
            }
            
            // Login successful! Save session
            localStorage.setItem('carDekhoLoggedIn', JSON.stringify({
                name: foundUser.name,
                email: foundUser.email,
                phone: foundUser.phone
            }));
            
            // Redirect to home page
            alert("Login Successful! Welcome back, " + foundUser.name + "!");
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
