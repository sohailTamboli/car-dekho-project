<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Car Dekho</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #f4f4f4; }
        
        /* EXACT NAVBAR CSS */
        .navbar { display: flex; align-items: center; gap: 20px; padding: 10px; background-color: #f8f9fa; }
        .navbar a { text-decoration: none; color: black; font-weight: 500; }
        .navbar { display: flex; align-items: center; gap: 20px; white-space: nowrap; }
        .anchor { display: flex; gap: 20px; margin-left: auto; }
        .navbar .fa-bars { display: none; }
        
        @media (max-width: 768px) {
            .navbar .fa-bars { display: block; cursor: pointer; font-size: 24px; }
            .anchor { display: none; flex-direction: column; position: absolute; top: 50px; background: white; width: 100%; padding: 20px; left: 0; }
            .anchor.active { display: flex; }
        }

        /* AUTH PAGE CSS - COMPACT FIT */
        .auth-container {
            max-width: 320px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            height: calc(100vh - 50px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .auth-title { text-align: center; font-size: 1.5rem; margin-bottom: 15px; color: #333; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 0.9rem; background: #f9f9f9; }
        
        .auth-btn { display: block; width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .auth-btn:hover { background: #0056b3; }
        
        .auth-switch { text-align: center; margin-top: 15px; font-size: 0.85rem; color: #777; }
        .auth-switch a { color: #007bff; font-weight: bold; text-decoration: none; }
        
        .alert-msg { color: #dc3545; font-weight: bold; text-align: center; margin-top: 5px; display: none; font-size: 0.9rem; }
        .success-msg { color: #28a745; font-weight: bold; text-align: center; margin-top: 5px; display: none; font-size: 0.9rem; }

        /* --- AESTHETIC UPGRADE: FONTS --- */
        body {
            font-family: 'Poppins', sans-serif;
        }

        h1, h2, h3, .brand-title, .featured-cars h2, .contact-title, .compare-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        /* --- DARK MODE STYLES (Added by me) --- */
        body.dark-mode {
            background: #121212;
            color: #e0e0e0;
        }

        body.dark-mode .navbar {
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
        }

        body.dark-mode .navbar a {
            color: #e0e0e0;
        }

        body.dark-mode .auth-container {
            background: #1e1e1e;
            color: #e0e0e0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        body.dark-mode .auth-title {
            color: #e0e0e0;
        }

        body.dark-mode .form-group label {
            color: #e0e0e0;
        }

        body.dark-mode .form-group input {
            background: #2a2a2a;
            color: #e0e0e0;
            border-color: #555;
        }

        body.dark-mode .auth-switch {
            color: #a0a0a0;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <i class="fas fa-car"></i> Car Dekho
        <i class="fas fa-bars"></i>
        <div class="anchor">
            <a href="index.html">Home</a>
            <a href="cars.html">Cars</a>
            <a href="compare.html">Compare</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="auth-container">
        <h1 class="auth-title">Register</h1>
        
        <div class="alert-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg">Registration Successful! Redirecting to Login...</div>

        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="regPhone" placeholder="Enter your phone" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Create a password" required>
            </div>
            <button type="submit" class="auth-btn">Register</button>
        </form>

        <div class="auth-switch">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <!-- DARK MODE JAVASCRIPT (Added by me) -->
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;
            
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            // Basic Validation
            if (name.length < 3) {
                errorMsg.textContent = "Name must be at least 3 characters.";
                errorMsg.style.display = 'block';
                return;
            }
            
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errorMsg.textContent = "Please enter a valid email.";
                errorMsg.style.display = 'block';
                return;
            }
            
            if (phone.length !== 10 || !/^[0-9]+$/.test(phone)) {
                errorMsg.textContent = "Phone must be exactly 10 digits.";
                errorMsg.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorMsg.textContent = "Password must be at least 6 characters.";
                errorMsg.style.display = 'block';
                return;
            }
            
            // Check if user already exists
            const users = JSON.parse(localStorage.getItem('carDekhoUsers')) || [];
            const existingUser = users.find(u => u.email === email.toLowerCase());
            
            if (existingUser) {
                errorMsg.textContent = "This email is already registered. Please login.";
                errorMsg.style.display = 'block';
                return;
            }
            
            // Save User to localStorage (Permanent)
            const newUser = {
                name: name,
                email: email.toLowerCase(),
                phone: phone,
                password: password
            };
            
            users.push(newUser);
            localStorage.setItem('carDekhoUsers', JSON.stringify(users));
            
            successMsg.style.display = 'block';
            
            // Redirect to login after 2 seconds
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });
    </script>

</body>
</html>
