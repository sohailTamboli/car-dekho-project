    <style>
        body { 
            margin: 0; 
            background: #f4f4f4; 
            padding: 20px;
        }

        /* --- EXIT BUTTON (Top Right) --- */
        .exit-container {
            display: flex;
            justify-content: flex-end; /* Pushes button to the right */
            margin-bottom: 20px;
        }
        .exit-btn {
            background: green;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.2s;
        }
        .exit-btn:hover {
            background: #c82333;
        }

        /* --- CARD GRID CSS --- */
        .page-title { text-align: center; font-size: 2rem; margin-bottom: 30px; }
        .car-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 30px; 
            max-width: 1000px; 
            margin: 0 auto; 
            align-items: start;
        }
        .car-card { 
            background: white; 
            border-radius: 10px; 
            padding: 20px; 
            text-align: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            scroll-margin-top: 20px; /* Prevents navbar overlap */
        }
        .car-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
        .price { font-weight: bold; margin: 10px 0; }
        
        .more-info-btn { 
            background: none; 
            border: none; 
            color: #007bff; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 5px; 
        }
        .specs { 
            text-align: left; 
            font-size: 0.9rem; 
            margin-top: 15px; 
            border-top: 1px solid #ddd; 
            padding-top: 12px; 
            background: #f9f9f9; 
            border-radius: 5px; 
            padding: 10px; 
            display: none; 
        }
        .specs span { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 5px; 
            border-bottom: 1px dashed #eee; 
        }
        .specs span:last-child { border-bottom: none; }
        
        @media (max-width: 768px) { .car-grid { grid-template-columns: 1fr; } }

        /* --- AESTHETIC UPGRADE: FONTS --- */
        body {
            font-family: 'Poppins', sans-serif;
        }

        h1, h2, h3, .brand-title, .featured-cars h2, .contact-title, .compare-title {
            font-family: 'Montserrat', sans-serif;

        }

        /* --- DARK MODE STYLES (Added by me) --- */
        body.dark-mode {

        }

                    </div>

            });

            if(window.location.hash) {

                    targetCard.scrollIntoView({ behavior: 'smooth' });
                    // Automatically click the 'More Info' button

                    if(btn) btn.click();
                }
